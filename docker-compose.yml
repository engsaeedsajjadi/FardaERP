# FardaERP production stack (§26)
#
#   mariadb 10.6 (pinned) · redis-cache 7.4.1 · redis-queue 7.4.1 ·
#   backend (gunicorn) · workers · scheduler · websocket (node socketio) ·
#   frontend (nginx: assets + reverse proxy + socketio upgrade)
#
# Usage — see docs/DOCKER.md. Secrets come ONLY from .env (never committed).
# At deploy time replace tag pins with digest pins after registry verification.

name: fardaerp

x-farda-env: &farda-env
  SITE_NAME: ${SITE_NAME:?set SITE_NAME in .env}
  DB_HOST: mariadb
  DB_PORT: "3306"
  REDIS_CACHE_URL: redis://redis-cache:6379
  REDIS_QUEUE_URL: redis://redis-queue:6379
  # FardaERP integrations (values from .env; empty = feature disabled/console)
  FARDA_OTP_PEPPER: ${FARDA_OTP_PEPPER:-}
  FARDA_SMS_PROVIDER: ${FARDA_SMS_PROVIDER:-console}
  KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
  KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
  MELIPAYAMAK_USERNAME: ${MELIPAYAMAK_USERNAME:-}
  MELIPAYAMAK_PASSWORD: ${MELIPAYAMAK_PASSWORD:-}
  MELIPAYAMAK_SENDER: ${MELIPAYAMAK_SENDER:-}
  GHASEDAK_API_KEY: ${GHASEDAK_API_KEY:-}
  GHASEDAK_SENDER: ${GHASEDAK_SENDER:-}
  FARDA_ALERT_SMS_NUMBERS: ${FARDA_ALERT_SMS_NUMBERS:-}
  FARDA_PAYMENT_GATEWAY: ${FARDA_PAYMENT_GATEWAY:-}
  FARDA_PAYMENT_SANDBOX: ${FARDA_PAYMENT_SANDBOX:-1}
  ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
  IDPAY_API_KEY: ${IDPAY_API_KEY:-}
  NEXTPAY_API_KEY: ${NEXTPAY_API_KEY:-}

services:
  mariadb:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mariadb/99farda.cnf:/etc/mysql/mariadb.conf.d/99farda.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      # slow disks / Docker Desktop on Windows can need several minutes after a restart
      start_period: 300s
      start_interval: 5s

  redis-cache:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  redis-queue:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    image: fardaerp:16.34.2
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: final
    restart: unless-stopped
    environment:
      <<: *farda-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-0}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  workers:
    image: fardaerp:16.34.2
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: final
    restart: unless-stopped
    command: ["bench", "worker", "--queue", "short,default,long"]
    environment: *farda-env
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "frappe worker"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 60s

  scheduler:
    image: fardaerp:16.34.2
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: final
    restart: unless-stopped
    command: ["bench", "schedule"]
    environment: *farda-env
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "frappe schedule"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 60s

  websocket:
    image: fardaerp:16.34.2
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: final
    restart: unless-stopped
    command: ["node", "apps/frappe/socketio.js"]
    environment: *farda-env
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      redis-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/socket.io/?EIO=4&transport=polling"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 30s

  frontend:
    image: fardaerp-frontend:16.34.2
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: frontend
    restart: unless-stopped
    ports:
      # host port from .env (HTTP_PORT); default 80
      - "${HTTP_PORT:-80}:8080"
    environment:
      # the Frappe site nginx serves (single-site); equals SITE_NAME from .env
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:?set SITE_NAME in .env}
    volumes:
      - sites:/var/www/sites
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_started

volumes:
  db-data:
  queue-data:
  sites:
